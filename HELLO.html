<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>I have something to ask 🥺</title>
<style>
:root {
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; margin: 0; }
body {
  background: linear-gradient(160deg, #ffe3ee, #ffc2d8);
  color: #5a1a3a;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.screen { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 24px; box-sizing: border-box; }
.emoji { font-size: 72px; line-height: 1; }
h1 { font-size: 30px; margin: 0; }
p { margin: 0; opacity: .8; min-height: 1.4em; }
.row { display: flex; gap: 18px; align-items: center; justify-content: center; margin-top: 10px; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 14px 28px; -webkit-appearance: none; appearance: none; }
#yes { background: #ff4d8d; color: #fff; font-size: 20px; }
#no { background: #fff; color: #8a5a72; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#win { display: none; }
.heart { position: fixed; bottom: -40px; font-size: 28px; animation: rise 3s linear forwards; pointer-events: none; }
@keyframes rise { to { transform: translateY(-110vh); opacity: 0; } }
</style>
</head>
<body>
<div class="screen" id="ask">
  <div class="emoji">🥺</div>
  <h1>Will you be my girlfriend?</h1>
  <p id="hint">pls say yes 💖</p>
  <div class="row">
    <button id="yes" type="button">Yes 💕</button>
    <button id="no" type="button">No</button>
  </div>
</div>

<div class="screen" id="win">
  <div class="emoji">🥰</div>
  <h1>YAYYY!! You said yes 💖</h1>
  <p>best decision ever, no cap</p>
</div>

<script>
var yes = document.getElementById("yes");
var no = document.getElementById("no");
var hint = document.getElementById("hint");
var scale = 1, count = 0, last = 0;
var lines = ["Really?🥺", "Are you sure? 😔", "Pretty please? 🥹", "Think about it again 💭", "I’ll be so sad 😭", "I’ll buy you food 🍰", "Don’t break my heart 💔", "I know you wanna say yes 😳", "Just click Yes pls 💖"];

function dodge(e) {
  if (e && e.cancelable) e.preventDefault();
  var now = Date.now();
  if (now - last < 350) return;
  last = now;

  var w = window.innerWidth, h = window.innerHeight;
  var bw = no.offsetWidth, bh = no.offsetHeight;
  var x = 12 + Math.random() * Math.max(0, w - bw - 24);
  var y = 12 + Math.random() * Math.max(0, h - bh - 24);
  no.style.position = "fixed";
  no.style.left = x + "px";
  no.style.top = y + "px";

  count++;
  scale = Math.min(scale + 0.12, 2.2);
  yes.style.transform = "scale(" + scale + ")";
  hint.textContent = lines[(count - 1) % lines.length];
}

no.addEventListener("touchstart", dodge, { passive: false });
no.addEventListener("mouseover", dodge);
no.addEventListener("click", dodge);

yes.addEventListener("click", function () {
  document.getElementById("ask").style.display = "none";
  document.getElementById("win").style.display = "flex";
  no.style.display = "none";
  var icons = ["💖", "💕", "💗", "💘", "❤️"];
  for (var i = 0; i < 40; i++) {
    var el = document.createElement("div");
    el.className = "heart";
    el.textContent = icons[i % icons.length];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDelay = Math.random() * 2 + "s";
    document.body.appendChild(el);
  }
});
</script>
</body>
</html>
